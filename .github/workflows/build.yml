name: Build Mod
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: stable
          combine: true
  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(find "${{ steps.build.outputs.build-output }}" -name "*.geode" | head -n 1)
          cp "$FILE" andrei123459.levels.geode
          gh release delete latest --cleanup-tag --yes --repo "${{ github.repository }}" || true
          gh release create latest andrei123459.levels.geode --title "Latest build" --notes "Automatic build" --target "${{ github.sha }}" --repo "${{ github.repository }}"
